# Secure Evidence Locker - Unified Deployment
version: '3.8'

services:
  # Python AI Backend (Storage & Analysis)
  ai-backend:
    build:
      context: ./services/ai-storage
    ports:
      - "5000:5000"
    volumes:
      - ./services/ai-storage/uploads:/app/uploads
    environment:
      - FLASK_ENV=production
    restart: always

  # React Frontend Dashboard
  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      - ai-backend
    restart: always

